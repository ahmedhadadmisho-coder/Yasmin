<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الياسمين | لصناعة مواد التنظيف</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo-box">
      <img src="logo.jpg" alt="الياسمين">
      <div>
        <h1>الياسمين</h1>
        <span>لصناعة مواد التنظيف</span>
      </div>
    </div>
    <button class="cart-btn">السلة (<span id="cart-count">0</span>)</button>
  </header>

  <section class="hero">
    <h2>نظافة تحس بيها، وجودة تثق فيها</h2>
    <p>من مصنع الياسمين ليك طول، من غير وسيط. الدفع عند الاستلام</p>
    <a href="#products" class="hero-btn">تسوّق توا</a>
  </section>

  <main>
    <h2>منتجاتنا</h2>
    <p class="sub">منتجات مصنوعة في ليبيا، بجودة تنافس المستورد</p>
    <div id="products" class="products"></div>
  </main>

  <section class="cart">
    <h2>سلة التسوق</h2>
    <div id="cart-items">السلة فاضية توا</div>
    <p><strong>الإجمالي:</strong> <span id="total">0</span> د.ل</p>
    <button class="whatsapp-btn" onclick="orderWhatsApp()">اطلب عبر واتساب</button>
  </section>

  <footer>© 2026 الياسمين لصناعة مواد التنظيف - جميع الحقوق محفوظة</footer>

  <script src="script.js"></script>
</body>
</html>
